name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts blocks arbitrary lifecycle scripts from untrusted/unreviewed
      # dependencies; sharp and unrs-resolver are the two reviewed packages that
      # genuinely need their install scripts (native binaries), so they're
      # rebuilt explicitly right after.
      - run: npm ci --ignore-scripts
      - run: npm rebuild sharp unrs-resolver
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
